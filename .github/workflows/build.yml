name: build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "tests/**"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/build-debug.yml"
    branches-ignore:
      - "feature/e2e-test*"
    tags:
      - "*"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

permissions:
  contents: write
  actions: read

env:
  TEST_SIGNALING_URLS: ${{ secrets.TEST_SIGNALING_URLS }}
  TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
  TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
  TEST_API_URL: ${{ secrets.TEST_API_URL }}
  OPENH264_VERSION: 2.6.0

jobs:
  # VERSION ファイルからバージョン情報を取得
  get_sdk_version:
    runs-on: ubuntu-slim
    outputs:
      sdk_version: ${{ steps.version.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            VERSION
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          SDK_VERSION=$(cat VERSION)
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT
          echo "SDK Version: $SDK_VERSION"

  # まず pyi を生成する
  # クロスコンパイル環境だと pyi が生成できないので、
  # １箇所で pyi を生成してアーティファクトにアップロードして、
  # それを各ビルドで利用する形にする。
  build_pyi:
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get -y install libx11-dev
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - name: Generate pyi
        run: |
          uv run python run.py build ubuntu-24.04_x86_64
          mkdir sora_sdk/
          cp src/sora_sdk/py.typed sora_sdk/
          cp src/sora_sdk/sora_sdk_ext.pyi sora_sdk/
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/

  build_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            target: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
            os: ubuntu
            arch: x86_64
          - name: ubuntu-22.04_x86_64
            target: ubuntu-22.04_x86_64
            runs_on: ubuntu-22.04
            os: ubuntu
            arch: x86_64
          - name: ubuntu-24.04_armv8
            target: ubuntu-24.04_armv8
            runs_on: ubuntu-24.04
            os: ubuntu
            arch: armv8
          - name: ubuntu-22.04_armv8
            target: ubuntu-22.04_armv8
            runs_on: ubuntu-22.04
            os: ubuntu
            arch: armv8
          - name: raspberry-pi-os_armv8
            target: raspberry-pi-os_armv8
            runs_on: ubuntu-24.04
            os: raspberry-pi-os
            arch: armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    needs: [build_pyi]
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/
      - run: |
          cp sora_sdk/py.typed src/sora_sdk/py.typed
          cp sora_sdk/sora_sdk_ext.pyi src/sora_sdk/sora_sdk_ext.pyi

      # pyproject.toml の name を sora_sdk_rpi に書き換える
      # Raspberry Pi OS armv8 向けにビルドする場合のみ
      - name: sora_sdk_rpi
        if: ${{ matrix.platform.name == 'raspberry-pi-os_armv8' }}
        run: |
          sed -e 's/^name = "sora_sdk"/name = "sora_sdk_rpi"/' -i pyproject.toml

      # libx11-dev は Ubuntu 24.04 の時に必要になる
      - run: |
          sudo apt-get update
          sudo apt-get -y install libx11-dev
      # armv8 向け cross build で aarch64 の binutils を用意する
      - if: ${{ matrix.platform.arch == 'armv8' }}
        run: |
          sudo apt-get -y install binutils-aarch64-linux-gnu
      # Ubuntu armv8 用の Ubuntu archive keyring を明示 install し、
      # runner image 変更で pre-install が外れる将来の回帰を防ぐ
      - if: ${{ matrix.platform.os == 'ubuntu' && matrix.platform.arch == 'armv8' }}
        run: |
          sudo apt-get -y install ubuntu-keyring
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
      # Raspberry Pi OS 用の vendored keyring は SHA-256 が固定値と一致することを確認する
      - if: ${{ matrix.platform.name == 'raspberry-pi-os_armv8' }}
        name: Verify vendored keyrings
        run: |
          set -eux
          cd sysroot/keyrings
          sha256sum -c <<'EOF'
          506b815cbb32d9b6066b4a2aa524071e071761e7e7f68c3ac74f3061ba852017  debian-archive-keyring.gpg
          76603890d82a492175caf17aba68dc73acb1189c9fd58ec0c19145dfa3866d56  raspberrypi-archive-keyring.asc
          EOF
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync

      - if: ${{ matrix.platform.arch == 'x86_64' }}
        run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build

      # Ubuntu armv8 向け
      - if: ${{ matrix.platform.arch == 'armv8' }}
        run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build
        env:
          SORA_SDK_TARGET: ${{ matrix.platform.target }}

      # Raspberry Pi OS 向け sysroot の代表 header と manifest が展開されているか確認する
      - if: ${{ matrix.platform.name == 'raspberry-pi-os_armv8' }}
        name: Verify Raspberry Pi OS sysroot contents
        run: |
          set -eux
          root="_install/raspberry-pi-os_armv8/rootfs"
          test -f "$root/usr/include/aarch64-linux-gnu/sys/stat.h"
          test -f "$root/usr/include/c++/14/vector"
          test -f "$root/usr/include/libcamera/libcamera/camera.h"
          test -f "$root/usr/include/alsa/asoundlib.h"
          test -f "$root/usr/include/pulse/pulseaudio.h"
          test -f "$root/usr/include/nss/nss.h"
          python3 -c "import json; m=json.load(open('$root/.webrtc-build-sysroot.json')); assert len(m['deb_files']) >= 10, m['deb_files']"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: "dist/"

  build_ubuntu_arm:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_armv8
            target: ubuntu-24.04_armv8
            # arm64 でビルド
            runs_on: ubuntu-24.04-arm
            os: ubuntu
            arch: armv8
          - name: ubuntu-22.04_armv8
            target: ubuntu-22.04_armv8
            # arm64 でビルド
            runs_on: ubuntu-22.04-arm
            os: ubuntu
            arch: armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    needs: [build_pyi]
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/
      - run: |
          cp sora_sdk/py.typed src/sora_sdk/py.typed
          cp sora_sdk/sora_sdk_ext.pyi src/sora_sdk/sora_sdk_ext.pyi
      # libx11-dev は Ubuntu 24.04 の時に必要になる模様
      - run: |
          sudo apt-get update
          sudo apt-get -y install libx11-dev
      # arm64 native runner でも現行踏襲で aarch64 の binutils を install する
      - run: |
          sudo apt-get -y install binutils-aarch64-linux-gnu
      # clang-19
      - name: Install clang-19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod a+x llvm.sh
          sudo ./llvm.sh 19
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build
        env:
          SORA_SDK_TARGET: ${{ matrix.platform.target }}

  build_macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-15_arm64
            target: macos_arm64
            runs_on: macos-15
            os: macos
            python_host_platform: "macosx-15.0-arm64"
            archflags: "-arch arm64"
          - name: macos-14_arm64
            target: macos_arm64
            runs_on: macos-14
            os: macos
            python_host_platform: "macosx-14.0-arm64"
            archflags: "-arch arm64"
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    needs: [build_pyi]
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/
      - run: |
          cp sora_sdk/py.typed src/sora_sdk/py.typed
          cp sora_sdk/sora_sdk_ext.pyi src/sora_sdk/sora_sdk_ext.pyi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build
        env:
          _PYTHON_HOST_PLATFORM: ${{ matrix.platform.python_host_platform }}
          ARCHFLAGS: ${{ matrix.platform.archflags }}

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: "dist/"

  build_windows:
    needs: [build_pyi]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-2025_x86_64
            target: windows_x86_64
            runs_on: windows-2025
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/

      - run: |
          cp sora_sdk/py.typed src/sora_sdk/py.typed
          cp sora_sdk/sora_sdk_ext.pyi src/sora_sdk/sora_sdk_ext.pyi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: dist/

  # E2E テストの実行
  e2e_test:
    needs: [build_ubuntu, build_macos, build_windows]
    uses: ./.github/workflows/e2e-test.yml
    with:
      from_build: true
    secrets: inherit

  slack_notify:
    needs: [build_ubuntu, build_ubuntu_arm, build_macos, build_windows]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}

  publish_wheel:
    if: contains(github.ref, 'tags/202')
    # needs:
    #   - e2e_test
    needs:
      - build_ubuntu
      - build_macos
      - build_windows
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-22.04_x86_64
          - name: ubuntu-22.04_armv8
          - name: macos-15_arm64
          - name: macos-14_arm64
          - name: windows-2025_x86_64
          - name: raspberry-pi-os_armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: dist
      - run: |
          if [ -e dist/*.tar.gz ]; then
            mv dist/*.tar.gz ./
          fi
      # matrix の中で１個だけソースディストリビューション用のデータを残しておく
      - run: mv *.tar.gz dist/
        if: ${{ matrix.platform.name == 'macos-15_arm64' && matrix.python_version == '3.12' }}

      # テスト用
      # - name: Publish package to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      #   with:
      #     repository-url: https://test.pypi.org/legacy/
      #     verbose: true

      # 本番用
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Slack Notification
        if: failure()
        uses: shiguredo/github-actions/.github/actions/slack-notify@main # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: all
        env:
          GH_TOKEN: ${{ github.token }}

  create-release:
    if: contains(github.ref, 'tags/202')
    # needs:
    #   - e2e_test
    needs:
      - build_ubuntu
      - build_macos
      - build_windows
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_x86_64", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_x86_64", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_x86_64", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_x86_64", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_x86_64", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_x86_64", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_armv8", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_armv8", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-22.04_armv8", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_armv8", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_armv8", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "ubuntu-24.04_armv8", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-15_arm64", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-15_arm64", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-15_arm64", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-14_arm64", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-14_arm64", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "macos-14_arm64", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "windows-2025_x86_64", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "windows-2025_x86_64", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "windows-2025_x86_64", "python_version": "3.14" }
      - uses: ./.github/actions/download
        with: { "platform": "raspberry-pi-os_armv8", "python_version": "3.12" }
      - uses: ./.github/actions/download
        with: { "platform": "raspberry-pi-os_armv8", "python_version": "3.13" }
      - uses: ./.github/actions/download
        with: { "platform": "raspberry-pi-os_armv8", "python_version": "3.14" }

      - name: Env to output
        run: |
          echo "package_paths<<EOF" >> $GITHUB_OUTPUT
          cat package_paths.env >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: env
      - name: Release (Prerelease)
        if: contains(github.ref, 'dev')
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --prerelease \
            $(cat package_paths.env)
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release
        if: ${{ !contains(github.ref, 'dev') }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            $(cat package_paths.env)
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Release Creation
        run: |
          gh release view ${{ github.ref_name }} --json url
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Slack Notification
        if: failure()
        uses: shiguredo/github-actions/.github/actions/slack-notify@main # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: all
        env:
          GH_TOKEN: ${{ github.token }}
