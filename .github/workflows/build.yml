name: build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/e2e-test.yml"
      - ".github/workflows/build-debug.yml"
    branches-ignore:
      - "feature/e2e-test*"
    tags:
      - "*"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

permissions:
  contents: write
  actions: read

env:
  TEST_SIGNALING_URLS: ${{ secrets.TEST_SIGNALING_URLS }}
  TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
  TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
  TEST_API_URL: ${{ secrets.TEST_API_URL }}
  OPENH264_VERSION: 2.6.0

jobs:
  # VERSION ファイルからバージョン情報を取得
  get_sdk_version:
    runs-on: ubuntu-slim
    outputs:
      sdk_version: ${{ steps.version.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            VERSION
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          SDK_VERSION=$(cat VERSION)
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT
          echo "SDK Version: $SDK_VERSION"

  # まず pyi を生成する
  # クロスコンパイル環境だと pyi が生成できないので、
  # １箇所で pyi を生成してアーティファクトにアップロードして、
  # それを各ビルドで利用する形にする。
  build_pyi:
    if: false
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          sudo apt-get -y install libx11-dev
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - name: Generate pyi
        run: |
          uv run python run.py build ubuntu-24.04_x86_64
          mkdir sora_sdk/
          cp src/sora_sdk/py.typed sora_sdk/
          cp src/sora_sdk/sora_sdk_ext.pyi sora_sdk/
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/

  build_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            target: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
            os: ubuntu
            arch: x86_64
          - name: ubuntu-22.04_x86_64
            target: ubuntu-22.04_x86_64
            runs_on: ubuntu-22.04
            os: ubuntu
            arch: x86_64
          - name: ubuntu-24.04_armv8
            target: ubuntu-24.04_armv8
            runs_on: ubuntu-24.04
            os: ubuntu
            arch: armv8
          - name: ubuntu-22.04_armv8
            target: ubuntu-22.04_armv8
            runs_on: ubuntu-22.04
            os: ubuntu
            arch: armv8
          - name: raspberry-pi-os_armv8
            target: raspberry-pi-os_armv8
            runs_on: ubuntu-24.04
            os: raspberry-pi-os
            arch: armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
        exclude:
          - platform: { name: ubuntu-22.04_x86_64 }
          - platform: { name: ubuntu-22.04_armv8 }
          - platform: { name: raspberry-pi-os_armv8 }
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pyproject.toml の name を sora_sdk_rpi に書き換える
      # Raspberry Pi OS armv8 向けにビルドする場合のみ
      - name: sora_sdk_rpi
        if: ${{ matrix.platform.name == 'raspberry-pi-os_armv8' }}
        run: |
          sed -e 's/^name = "sora_sdk"/name = "sora_sdk_rpi"/' -i pyproject.toml

      # libx11-dev は Ubuntu 24.04 の時に必要になる
      - run: |
          sudo apt-get update
          sudo apt-get -y install libx11-dev
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync --no-install-project

      - if: ${{ matrix.platform.arch == 'x86_64' }}
        run: uv build --wheel

      # cross-compile (ubuntu-24.04_armv8) 用 wheel ビルド。
      # SORA_PYTHON_SDK_SYSROOT_DIR は cmake/toolchains/aarch64-linux-gnu.cmake で
      # CMAKE_SYSROOT に渡される (toolchain 評価時点で path 存在が必要なため事前に mkdir)。
      # sysroot の中身は fetch_deps.cmake 内 _sora_fetch_rootfs (sysroot.py) で構築する。
      # _PYTHON_HOST_PLATFORM=linux-aarch64 で wheel タグの platform 部分を linux_aarch64 に確定する。
      # CMAKE_ARGS の 4 値は cmake configure 開始時に必要なため、 pyproject.toml の override ではなく
      # 環境変数経由で cmake コマンドラインに直接渡す。 NB_SUFFIX と SORA_GEN_PYI は CMakeLists.txt で確定する。
      - name: Build wheel (cross ubuntu-24.04_armv8)
        if: matrix.platform.target == 'ubuntu-24.04_armv8'
        env:
          SORA_PYTHON_SDK_PLATFORM: ubuntu-24.04_armv8
          SORA_PYTHON_SDK_SYSROOT_DIR: ${{ github.workspace }}/_deps/ubuntu-24.04_armv8/rootfs
          _PYTHON_HOST_PLATFORM: linux-aarch64
          CMAKE_ARGS: >-
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
            -DSORA_PYTHON_SDK_PLATFORM=ubuntu-24.04_armv8
            -DCMAKE_C_COMPILER_WORKS=TRUE
            -DCMAKE_CXX_COMPILER_WORKS=TRUE
        run: |
          mkdir -p "${SORA_PYTHON_SDK_SYSROOT_DIR}"
          uv build --wheel

      # 生成した wheel が確かに linux_aarch64 / aarch64 ELF であることを 4 段で検証する。
      - name: Verify wheel architecture (cross ubuntu-24.04_armv8)
        if: matrix.platform.target == 'ubuntu-24.04_armv8'
        shell: bash
        run: |
          set -eux
          shopt -s nullglob
          ls dist/
          WHEELS=(dist/sora_sdk-*-cp*-linux_aarch64.whl)
          [[ ${#WHEELS[@]} -eq 1 ]] || { echo "ERROR: expected 1 linux_aarch64 wheel, got ${#WHEELS[@]}"; ls dist/; exit 1; }
          WHL="${WHEELS[0]}"
          WHL_DIR=$(mktemp -d)
          unzip -o "$WHL" -d "$WHL_DIR"
          SO_FILES=("$WHL_DIR/sora_sdk/sora_sdk_ext."*.so)
          [[ ${#SO_FILES[@]} -eq 1 ]] || { echo "ERROR: expected 1 .so, got ${#SO_FILES[@]}"; ls "$WHL_DIR/sora_sdk/"; exit 1; }
          SO_FILE="${SO_FILES[0]}"
          [[ "$SO_FILE" == *"-aarch64-linux-gnu.so" ]] || { echo "ERROR: .so suffix is not -aarch64-linux-gnu: $SO_FILE"; exit 1; }
          FILE_OUT=$(file "$SO_FILE")
          echo "$FILE_OUT"
          grep -qE 'ELF 64-bit LSB.*ARM aarch64' <<< "$FILE_OUT" || { echo "ERROR: .so is not aarch64 ELF; actual: $FILE_OUT"; exit 1; }

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: "dist/"

  # sysroot.py を CI 上で 4 platform 順次ビルドして検証する。
  # rootfs 構築の決定的な検証 (依存解決 / .deb 展開 / symlink 後処理 / キャッシュ動作) を CI で固定する。
  verify_sysroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: dpkg-deb --version
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: ubuntu-22.04_armv8
        run: |
          set -eux
          python3 sysroot.py build --config sysroot/ubuntu-22.04_armv8.json --dest /tmp/rootfs
          test -e /tmp/rootfs/usr/include/aarch64-linux-gnu/sys/types.h
          test -e /tmp/rootfs/usr/include/c++/11/cstddef
          test "$(find /tmp/rootfs -type l -lname '/*' | wc -l)" = "0"
          test -L /tmp/rootfs/lib && test -L /tmp/rootfs/bin && test -L /tmp/rootfs/sbin
          ! test -e /tmp/rootfs/usr/sbin/exim4
          ! test -e /tmp/rootfs/usr/sbin/sendmail
          ! test -e /tmp/rootfs/usr/sbin/postfix
          ! test -e /tmp/rootfs/usr/sbin/cron
          find /tmp/rootfs -type f -printf '%s\n' | awk '{s+=$1}END{print s; if (s > 200*1024*1024) exit 1}'
          python3 sysroot.py clean --dest /tmp/rootfs
      - name: ubuntu-24.04_armv8
        run: |
          set -eux
          python3 sysroot.py build --config sysroot/ubuntu-24.04_armv8.json --dest /tmp/rootfs
          test -e /tmp/rootfs/usr/include/aarch64-linux-gnu/sys/types.h
          test -e /tmp/rootfs/usr/include/c++/13/cstddef
          test "$(find /tmp/rootfs -type l -lname '/*' | wc -l)" = "0"
          test -L /tmp/rootfs/lib && test -L /tmp/rootfs/bin && test -L /tmp/rootfs/sbin
          ! test -e /tmp/rootfs/usr/sbin/exim4
          ! test -e /tmp/rootfs/usr/sbin/sendmail
          ! test -e /tmp/rootfs/usr/sbin/postfix
          ! test -e /tmp/rootfs/usr/sbin/cron
          find /tmp/rootfs -type f -printf '%s\n' | awk '{s+=$1}END{print s; if (s > 200*1024*1024) exit 1}'
          python3 sysroot.py clean --dest /tmp/rootfs
      - name: raspberry-pi-os_armv8
        run: |
          set -eux
          python3 sysroot.py build --config sysroot/raspberry-pi-os_armv8.json --dest /tmp/rootfs
          test -e /tmp/rootfs/usr/include/aarch64-linux-gnu/sys/types.h
          test -e /tmp/rootfs/usr/include/c++/11/cstddef
          test -d /tmp/rootfs/usr/include/libcamera
          ls /tmp/rootfs/usr/include/libcamera/ | head
          test "$(find /tmp/rootfs -type l -lname '/*' | wc -l)" = "0"
          test -L /tmp/rootfs/lib && test -L /tmp/rootfs/bin && test -L /tmp/rootfs/sbin
          ! test -e /tmp/rootfs/usr/sbin/exim4
          ! test -e /tmp/rootfs/usr/sbin/sendmail
          ! test -e /tmp/rootfs/usr/sbin/postfix
          ! test -e /tmp/rootfs/usr/sbin/cron
          find /tmp/rootfs -type f -printf '%s\n' | awk '{s+=$1}END{print s; if (s > 300*1024*1024) exit 1}'
          python3 sysroot.py clean --dest /tmp/rootfs
      - name: ubuntu-22.04_armv8_jetson
        run: |
          set -eux
          # jetson rootfs は 8 GB に達するため /var/tmp に置く
          python3 sysroot.py build --config sysroot/ubuntu-22.04_armv8_jetson.json --dest /var/tmp/rootfs-jetson
          test -e /var/tmp/rootfs-jetson/usr/include/aarch64-linux-gnu/sys/types.h
          test -e /var/tmp/rootfs-jetson/usr/include/c++/10/cstddef
          # NVIDIA の .deb には postinst で解決される前提の broken absolute symlink が含まれる
          # ため、 ここでは数を記録するだけで 0 件チェックはしない (buildbase.py 経路と機能等価)
          echo "absolute symlinks remaining: $(find /var/tmp/rootfs-jetson -type l -lname '/*' | wc -l)"
          test -L /var/tmp/rootfs-jetson/lib && test -L /var/tmp/rootfs-jetson/bin && test -L /var/tmp/rootfs-jetson/sbin
          ! test -e /var/tmp/rootfs-jetson/usr/sbin/exim4
          ! test -e /var/tmp/rootfs-jetson/usr/sbin/sendmail
          ! test -e /var/tmp/rootfs-jetson/usr/sbin/postfix
          ! test -e /var/tmp/rootfs-jetson/usr/sbin/cron
          # nvidia-jetpack の transitive 依存 (CUDA / TensorRT / OpenCV など) が大きく
          # rootfs が数十 GB に達するため、 サイズの記録のみ行う (最適化は cross-compile 復活時の別件)
          find /var/tmp/rootfs-jetson -type f -printf '%s\n' | awk '{s+=$1}END{print "jetson rootfs total bytes:", s}'
          python3 sysroot.py clean --dest /var/tmp/rootfs-jetson
      - name: stamp 動作と --force / clean の確認
        run: |
          set -eux
          # 1 回目: 通常 build
          python3 sysroot.py build --config sysroot/ubuntu-24.04_armv8.json --dest /tmp/rootfs
          # 2 回目: stamp 一致なら skip され .sysroot.stamp が変わらない
          STAMP_BEFORE=$(cat /tmp/rootfs/.sysroot.stamp)
          python3 sysroot.py build --config sysroot/ubuntu-24.04_armv8.json --dest /tmp/rootfs
          STAMP_AFTER=$(cat /tmp/rootfs/.sysroot.stamp)
          test "$STAMP_BEFORE" = "$STAMP_AFTER"
          # --force で再構築されることを確認
          python3 sysroot.py build --config sysroot/ubuntu-24.04_armv8.json --dest /tmp/rootfs --force
          # clean で /tmp/rootfs と .sysroot.stamp が消える
          python3 sysroot.py clean --dest /tmp/rootfs
          ! test -e /tmp/rootfs
          # 不在 dest を clean しても no-op exit 0
          python3 sysroot.py clean --dest /tmp/rootfs

  build_ubuntu_arm:
    if: false
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_armv8
            target: ubuntu-24.04_armv8
            # arm64 でビルド
            runs_on: ubuntu-24.04-arm
            os: ubuntu
            arch: armv8
          - name: ubuntu-22.04_armv8
            target: ubuntu-22.04_armv8
            # arm64 でビルド
            runs_on: ubuntu-22.04-arm
            os: ubuntu
            arch: armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    needs: [build_pyi]
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sora_sdk_${{ matrix.python_version }}
          path: sora_sdk/
      - run: |
          cp sora_sdk/py.typed src/sora_sdk/py.typed
          cp sora_sdk/sora_sdk_ext.pyi src/sora_sdk/sora_sdk_ext.pyi
      # libx11-dev は Ubuntu 24.04 の時に必要になる模様
      - run: |
          sudo apt-get update
          sudo apt-get -y install libx11-dev
      - run: |
          sudo apt-get -y install multistrap binutils-aarch64-linux-gnu
          # multistrap に insecure なリポジトリからの取得を許可する設定を入れる
          sudo sed -e 's/Apt::Get::AllowUnauthenticated=true/Apt::Get::AllowUnauthenticated=true";\n$config_str .= " -o Acquire::AllowInsecureRepositories=true/' -i /usr/sbin/multistrap
      # clang-19
      - name: Install clang-19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod a+x llvm.sh
          sudo ./llvm.sh 19
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync
      - run: |
          uv run python run.py build ${{ matrix.platform.target }}
          uv build
        env:
          SORA_SDK_TARGET: ${{ matrix.platform.target }}

  build_macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macos-14 / macos-15 両 runner で同じ wheel タグ (macosx_14_0_arm64) を生成する。
          - name: macos-15_arm64
            runs_on: macos-15
            python_host_platform: "macosx-14.0-arm64"
            archflags: "-arch arm64"
          - name: macos-14_arm64
            runs_on: macos-14
            python_host_platform: "macosx-14.0-arm64"
            archflags: "-arch arm64"
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      - run: uv sync --no-install-project
      - run: uv build --wheel
        env:
          # 3 つの env をまとめて指定して wheel タグを macosx_14_0_arm64 に確定する。
          # _PYTHON_HOST_PLATFORM は macos-15 runner で sysconfig が返す 15.0 を上書きするため必須。
          _PYTHON_HOST_PLATFORM: ${{ matrix.platform.python_host_platform }}
          ARCHFLAGS: ${{ matrix.platform.archflags }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: "dist/"

  build_windows:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-2025_x86_64
            runs_on: windows-2025
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}
      # Ninja + MSVC ビルドを行うため、uv build --wheel 前に amd64 開発者環境を有効化する
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      # プロジェクト本体の二重ビルドを避けるため、ここでは依存解決のみ行う
      - run: uv sync --no-install-project
      - run: uv build --wheel
      # Windows では .pyd の DLL 解決などで import 失敗するリスクがあるため、
      # アーティファクトアップロード前に最低限のテストを実行する
      - shell: bash
        run: |
          uv pip install --force-reinstall dist/*.whl
          uv run --no-sync pytest tests/test_version.py
          uv run --no-sync python -c "from sora_sdk import sora_sdk_ext; print(sora_sdk_ext.__file__)"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: "dist/"

  # E2E テストの実行
  e2e_test:
    if: false
    needs: [build_ubuntu, build_macos, build_windows]
    uses: ./.github/workflows/e2e-test.yml
    with:
      from_build: true
    secrets: inherit

  slack_notify:
    needs: [build_ubuntu, build_macos, build_windows]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}

  publish_wheel:
    if: contains(github.ref, 'tags/202')
    # needs:
    #   - e2e_test
    needs:
      - build_ubuntu
      - build_macos
      - build_windows
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-22.04_x86_64
          - name: ubuntu-22.04_armv8
          - name: macos-15_arm64
          - name: macos-14_arm64
          - name: windows-2025_x86_64
          - name: raspberry-pi-os_armv8
        python_version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: dist
      - run: |
          if [ -e dist/*.tar.gz ]; then
            mv dist/*.tar.gz ./
          fi
      # matrix の中で１個だけソースディストリビューション用のデータを残しておく
      - run: mv *.tar.gz dist/
        if: ${{ matrix.platform.name == 'macos-15_arm64' && matrix.python_version == '3.12' }}

      # テスト用
      # - name: Publish package to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      #   with:
      #     repository-url: https://test.pypi.org/legacy/
      #     verbose: true

      # 本番用
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Slack Notification
        if: failure()
        uses: shiguredo/github-actions/.github/actions/slack-notify@main # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-python-sdk
          notify_mode: all
        env:
          GH_TOKEN: ${{ github.token }}

  create-release:
