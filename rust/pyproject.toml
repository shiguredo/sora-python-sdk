[project]
name = "sora-rust-prototype"
version = "0.1.0"
description = "Sora Rust SDK ベースの Python プロトタイプ (PyO3 + Maturin)"
requires-python = ">=3.12"
license = "Apache-2.0"
# 実行時依存なし (プロトタイプ単体で完結する)
dependencies = []

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[tool.maturin]
# 既存パッケージ sora_sdk と同名衝突を避けるため別名にする
module-name = "sora_rust_sdk"
bindings = "pyo3"
manifest-path = "Cargo.toml"
python-source = "python"

[tool.pytest.ini_options]
# 現行テスト群と分離し rust/ 配下だけを対象にする
testpaths = ["tests"]
xfail_strict = true

[dependency-groups]
dev = [
    # ビルドバックエンドと同じ版を使うこと
    "maturin==1.14.1",
    "numpy~=2.5",
    "pytest~=9.1",
]
