[package]
name = "sora-rust-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
name = "sora_rust_sdk"
crate-type = ["cdylib"]

[dependencies]
# Sora Rust SDK 本体 (https://github.com/shiguredo/sora-rust-sdk)
# プロトタイプのため最新の canary を使う
sora_sdk = "2026.2.0-canary.2"
# WebRTC バインディング (Sink / Transformer / Logging の検証に直接使う)
# sora_sdk が canary 系列を要求するため系列を合わせる
shiguredo_webrtc = "0.152.1-canary.3"
# 非同期ランタイム (マルチスレッドで接続処理を駆動する)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# Python バインディング
pyo3 = { version = "0.29", features = ["extension-module"] }
# numpy 配列の構築
numpy = "0.29"
