[project]
name = "sora_sdk"
description = "WebRTC SFU Sora Python SDK"
readme = "README.md"
requires-python = ">= 3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.urls]
Discord = "https://discord.gg/shiguredo"
Documentation = "https://sora-python-sdk.shiguredo.jp"
Source = "https://github.com/shiguredo/sora-python-sdk"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
lint = ["ruff", "ty"]
test = ["httpx", "numpy", "pyjwt", "pytest", "pytest-repeat", "pytest-xdist"]

[build-system]
requires = ["scikit-build-core>=0.11.3", "nanobind==2.12.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# scikit-build-core のリリースごとの deprecation 影響を凍結するため固定する
minimum-version = "0.11.3"
# build_type を含めないと Debug ビルド後に Release 再ビルドする際に CMakeCache が混在する
build-dir = "_build/{wheel_tag}-{build_type}"

[tool.scikit-build.cmake]
version = ">=4.3"

[tool.scikit-build.ninja]
version = ">=1.13"

[tool.scikit-build.wheel]
packages = ["src/sora_sdk"]
# packages 内のパッケージルートからの相対パスで、source tree に残るビルド成果物が
# install(FILES) の出力と二重コピーされるのを防ぐ
exclude = [
  "sora_sdk_ext.pyi",
  "py.typed",
  "sora_sdk_ext.*.so",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
# VERSION ファイル全体が単一の非空白トークンであることを前提に行アンカーで縛る
regex = "^(?P<value>\\S+)$"

[[tool.scikit-build.overrides]]
if.env.BUILD_PROFILE = "^debug$"
cmake.build-type = "Debug"

[tool.pytest.ini_options]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ty.src]
include = ["src", "tests"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.pip]
exclude-newer = "7 days"
